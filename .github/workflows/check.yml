name: Self-review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint, test and review through MCP
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          if ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
            base=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          CRAP_BASE="$base" npm run check
          node scripts/prove.mjs
          CRAP_BASE="$base" node scripts/dashboard.mjs
      - name: Save the self-review dashboard
        uses: actions/upload-artifact@v4
        with:
          name: repository-health
          path: .crap-local/dashboard.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
